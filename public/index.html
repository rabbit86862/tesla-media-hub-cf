<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>车载影视</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 消除页面原生边距与滚动条 */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    /* 播放器全屏层强制铺满视口 */
    #player-layer {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      background: #000 !important;
    }

    .player-shell {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      position: relative !important;
    }

    /* 核心播放容器最大化 */
    #player-box, #drive-view, #iptv-view, #tesla-host, #iptv-host {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      overflow: hidden !important;
    }

    /* 强制让 WebCodecs 渲染的 canvas 画面自适应并占满窗口 */
    #player-box canvas, #tesla-host canvas, #iptv-host canvas {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
    }

    /* 顶栏悬浮置顶 */
    .player-head {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 100000 !important;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent) !important;
      padding: 10px 16px !important;
    }

    /* 选集栏悬浮置底 */
    .ep-strip {
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 100000 !important;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent) !important;
      margin: 0 !important;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <button id="btn-back" class="btn-back" onclick="historyBack()">‹</button>
    <div class="title-wrap">
      <span id="page-title">车载影视</span>
      <span id="page-sub" class="page-sub"></span>
    </div>
  </header>

  <main id="app"></main>

  <!-- 播放器全屏层 -->
  <div id="player-layer" class="player-layer hidden">
    <div class="player-shell">
      <div class="player-head">
        <div class="player-head-left">
          <button class="player-close" onclick="closePlayer()" aria-label="关闭"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
          <button class="quality-btn" id="btn-quality" style="display:none" onclick="cycleQuality()">清晰度</button>
        </div>
        <div class="player-title" id="player-title"></div>
      </div>
      <div id="player-box">
        <!-- AppleCMS 点播：车机本地 WebCodecs 解码到 Canvas（tesla-media-hub 内置播放库，无 video 标签） -->
        <div id="drive-view" class="drive-view hidden">
          <div id="tesla-host"></div>
        </div>
        <!-- IPTV：服务端 ffmpeg 转码推流 → tesla-media-hub 内置播放库拉流播放 -->
        <div id="iptv-view" class="drive-view hidden">
          <div id="iptv-host"></div>
        </div>
      </div>
      <div class="ep-strip" id="ep-strip"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal hidden"></div>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/iptv-player.js" type="module"></script>
  <script src="js/app.js"></script>
</body>
</html>
