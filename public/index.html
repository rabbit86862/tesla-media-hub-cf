<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>车载影视</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 适配剧场无边框容器的动态视口锁定 */
    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      background: #0f1115;
    }

    /* 顶部栏右侧工具组 */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .fs-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 12px;
      flex-shrink: 0;
    }
    .fs-btn {
      background: #1c212b;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .fs-btn:active {
      background: #2b3342;
      border-color: #3e88f7;
    }

    /* 强制全屏状态下的视口锁定，消除黑边与溢出 */
    html:fullscreen, html:-webkit-full-screen,
    body:fullscreen, body:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #0f1115 !important;
      overflow: hidden !important;
    }
    :fullscreen #player-layer,
    :-webkit-full-screen #player-layer {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="topbar-left">
      <button id="btn-back" class="btn-back" onclick="historyBack()">‹</button>
      <div class="title-wrap">
        <span id="page-title">车载影视</span>
        <span id="page-sub" class="page-sub"></span>
      </div>
    </div>
    <!-- 顶部续播、直播与全屏控制区 -->
    <div class="fs-actions">
      <button class="fs-btn" onclick="resumeLastWatch(0)" style="border-color:#3fb950;color:#3fb950;">🕒 继续观看</button>
      <button class="fs-btn" onclick="openTvModal()" style="border-color:#00b4d8;color:#00b4d8;">📺 电视直播</button>
      <button id="btn-web-fs" class="fs-btn" onclick="toggleWebFullscreen()">⛶ 全屏</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- 播放器全屏层 -->
  <div id="player-layer" class="player-layer hidden">
    <div class="player-shell">
      <div class="player-head">
        <div class="player-head-left">
          <button class="player-close" onclick="exitAndClosePlayer()" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="quality-btn" id="btn-quality" style="display:none" onclick="cycleQuality()">清晰度</button>
          <!-- 播放器内部全屏切换按钮 -->
          <button class="quality-btn" id="btn-player-fs" onclick="toggleWebFullscreen()">⛶ 全屏</button>
        </div>
        <div class="player-title" id="player-title"></div>
      </div>
      <div id="player-box">
        <!-- AppleCMS 点播：车机本地 WebCodecs 解码到 Canvas -->
        <div id="drive-view" class="drive-view hidden">
          <div id="tesla-host"></div>
        </div>
        <!-- IPTV：WebCodecs 直播解码 & YouTube 官方直播嵌入 -->
        <div id="iptv-view" class="drive-view hidden">
          <div id="iptv-host"></div>
        </div>
      </div>
      <div class="ep-strip" id="ep-strip"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal hidden"></div>

  <div id="toast" class="toast"></div>

  <script>
    // 1. 网页原生 Fullscreen API 切换
    function toggleWebFullscreen() {
      const elem = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // 2. 关闭播放器（同步刷新首页续播卡片）
    function exitAndClosePlayer() {
      if (typeof closePlayer === 'function') {
        closePlayer();
      }
      if (location.hash === '' || location.hash === '#/' || location.hash === '#') {
        if (typeof renderHome === 'function') renderHome();
      }
    }

    // 监听全屏状态变化，同步更新按钮文字与控制栏自动隐藏
    function syncFsButtonText() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const label = isFs ? '✕ 退出全屏' : '⛶ 全屏';
      const topBtn = document.getElementById('btn-web-fs');
      const playerBtn = document.getElementById('btn-player-fs');
      if (topBtn) topBtn.textContent = label;
      if (playerBtn) playerBtn.textContent = label;
    }

    // 全屏状态下：轻触屏幕显示上下控制栏，3 秒无操作自动隐藏
    let ctrlHideTimer = null;
    function wakeFullscreenControls() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFs) {
        document.documentElement.classList.remove('show-controls');
        return;
      }
      document.documentElement.classList.add('show-controls');
      clearTimeout(ctrlHideTimer);
      ctrlHideTimer = setTimeout(() => {
        document.documentElement.classList.remove('show-controls');
      }, 3000);
    }

    document.addEventListener('pointerdown', wakeFullscreenControls);
    document.addEventListener('fullscreenchange', () => {
      syncFsButtonText();
      wakeFullscreenControls();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      syncFsButtonText();
      wakeFullscreenControls();
    });
  </script>

  <!-- 电视直播频道弹窗（触屏直选源 + 多线路容错 + YouTube 新闻直播） -->
  <div id="tv-modal" class="modal hidden" onclick="if(event.target===this)closeTvModal()">
    <div class="modal-body" style="max-width:760px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h3 style="margin:0;">📺 电视直播</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="quality-btn" style="min-height:38px;" onclick="loadTvChannels(true)">🔄 刷新</button>
          <button class="player-close" style="min-height:38px;" onclick="closeTvModal()">✕</button>
        </div>
      </div>

      <!-- 订阅源触屏切换按钮（自动换行 + 紧凑间距，避免边缘裁切） -->
      <div id="tv-source-bar" class="tab-bar" style="display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;overflow:visible;"></div>

      <!-- 频道搜索框 -->
      <div class="search-row" style="margin-bottom:4px;">
        <input id="tv-search-input" type="text" placeholder="搜索频道（如：CCTV、卫视、TVBS、中天、TVB、Bloomberg…）" oninput="renderTvChannels()">
      </div>

      <!-- 分组标签栏 -->
      <div id="tv-group-bar" class="tab-bar" style="padding:2px 0 6px;"></div>

      <!-- 状态提示与频道网格 -->
      <div id="tv-status" class="tip" style="text-align:center;padding:8px 0;"></div>
      <div id="tv-channel-grid" class="ep-grid" style="grid-template-columns:repeat(auto-fill,minmax(135px,1fr));max-height:48vh;overflow-y:auto;padding-bottom:4px;"></div>
    </div>
  </div>

  <script>
    // 自动更新订阅源（支持内置 YouTube 频道列表 channels、单链接 url 与多镜像并发竞速 mirrors）
    const TV_SOURCES = [
      {
        name: 'YouTube 新闻',
        channels: [
          // 台湾新闻台
          { name: 'TVBS 新闻台', group: '台湾新闻', url: 'youtube://@TVBSNEWS01' },
          { name: '中天新闻台', group: '台湾新闻', url: 'youtube://@CtiNews' },
          { name: '三立 LIVE 新闻', group: '台湾新闻', url: 'youtube://@SETnews' },
          { name: '东森新闻台', group: '台湾新闻', url: 'youtube://@newsebc' },
          { name: '民视新闻台', group: '台湾新闻', url: 'youtube://@FTV_News' },
          { name: '台视新闻台', group: '台湾新闻', url: 'youtube://@TTV_NEWS' },
          { name: '华视新闻台', group: '台湾新闻', url: 'youtube://@CTS_NEWS' },
          { name: '公视新闻网', group: '台湾新闻', url: 'youtube://@PNNPTS' },
          // 香港新闻台
          { name: 'TVB 无綫新闻', group: '香港新闻', url: 'youtube://@TVBNews' },
          { name: '凤凰卫视资讯', group: '香港新闻', url: 'youtube://@ifeng-tv' },
          // 国际新闻台
          { name: 'CNA 亚洲新闻台', group: '国际新闻', url: 'youtube://@channelnewsasia' },
          { name: 'Bloomberg 彭博财经', group: '国际新闻', url: 'youtube://@markets' },
          { name: 'Sky News 英国天空', group: '国际新闻', url: 'youtube://@SkyNews' },
          { name: 'Al Jazeera 半岛英语', group: '国际新闻', url: 'youtube://@aljazeeraenglish' },
          { name: 'DW News 德国之声', group: '国际新闻', url: 'youtube://@dwnews' },
          { name: 'France 24 英语', group: '国际新闻', url: 'youtube://@FRANCE24English' }
        ]
      },
      { name: 'Guovin 综合', url: 'https://testingcf.jsdelivr.net/gh/Guovin/iptv-api@gd/output/result.m3u' },
      { name: 'YanG 央视卫视', url: 'https://testingcf.jsdelivr.net/gh/YanG-1989/m3u@main/Gather.m3u' },
      { name: 'APTV 精品', url: 'https://testingcf.jsdelivr.net/gh/Kimentanm/aptv@master/m3u/iptv.m3u' },
      { name: 'ZBDS 加速', url: 'https://live.zbds.top/tv/iptv4.m3u' },
      {
        name: 'Free-TV 两岸三地',
        urls: [
          {
            group: '中国大陆',
            mirrors: [
              'https://fastly.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_china.m3u8',
              'https://gcore.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_china.m3u8',
              '/api/stream?url=' + encodeURIComponent('https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_china.m3u8')
            ]
          },
          {
            group: '中国香港',
            mirrors: [
              'https://fastly.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_hong_kong.m3u8',
              'https://gcore.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_hong_kong.m3u8',
              '/api/stream?url=' + encodeURIComponent('https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_hong_kong.m3u8')
            ]
          },
          {
            group: '中国台湾',
            mirrors: [
              'https://fastly.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_taiwan.m3u8',
              'https://gcore.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_taiwan.m3u8',
              '/api/stream?url=' + encodeURIComponent('https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_taiwan.m3u8')
            ]
          }
        ]
      }
    ];

    let currentSourceIdx = 0;
    let allTvChannels = [];
    let currentTvGroup = '全部';
    let currentTvQueue = null;

    function renderTvSourceBar() {
      const bar = document.getElementById('tv-source-bar');
      if (!bar) return;
      bar.innerHTML = TV_SOURCES.map((src, idx) =>
        `<button class="tab ${idx === currentSourceIdx ? 'active' : ''}" onclick="switchTvSource(${idx})">${src.name}</button>`
      ).join('');
    }

    function switchTvSource(idx) {
      if (idx === currentSourceIdx && allTvChannels.length > 0) return;
      currentSourceIdx = idx;
      renderTvSourceBar();
      loadTvChannels(true);
    }

    function openTvModal() {
      renderTvSourceBar();
      document.getElementById('tv-modal').classList.remove('hidden');
      if (allTvChannels.length === 0) {
        loadTvChannels(false);
      } else {
        renderTvGroups();
        renderTvChannels();
      }
    }

    function closeTvModal() {
      document.getElementById('tv-modal').classList.add('hidden');
    }

    // 多节点并发竞速拉取（12 秒超时，任意节点先返回有效列表即刻采用）
    async function fetchM3uWithRace(urlList, forceRefresh) {
      const fetchOne = async (targetUrl) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        try {
          const res = await fetch(targetUrl, {
            cache: forceRefresh ? 'no-cache' : 'default',
            signal: controller.signal
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if (!text || (!text.includes('#EXTINF') && !text.includes('http'))) {
            throw new Error('无效列表内容');
          }
          return text;
        } finally {
          clearTimeout(timer);
        }
      };

      if (urlList.length === 1) {
        return await fetchOne(urlList[0]);
      }
      return await Promise.any(urlList.map(u => fetchOne(u)));
    }

    async function loadTvChannels(forceRefresh) {
      const statusEl = document.getElementById('tv-status');
      const gridEl = document.getElementById('tv-channel-grid');
      const currentSrc = TV_SOURCES[currentSourceIdx] || TV_SOURCES[0];

      if (forceRefresh) {
        allTvChannels = [];
        gridEl.innerHTML = '';
      }

      // 1. 内置 YouTube 频道列表直接秒加载
      if (Array.isArray(currentSrc.channels)) {
        allTvChannels = currentSrc.channels.map(c => ({
          name: c.name,
          group: c.group || 'YouTube 直播',
          urls: Array.isArray(c.urls) ? c.urls : [c.url]
        }));
        statusEl.style.display = 'none';
        renderTvGroups();
        renderTvChannels();
        return;
      }

      // 2. 外部 M3U 订阅源拉取
      statusEl.style.display = 'block';
      statusEl.textContent = '正在同步最新频道列表…';

      try {
        const tasks = Array.isArray(currentSrc.urls)
          ? currentSrc.urls.map(item => ({
              mirrors: item.mirrors || [item.url],
              group: item.group || ''
            }))
          : [{
              mirrors: currentSrc.url.includes('testingcf.jsdelivr.net')
                ? [
                    currentSrc.url,
                    currentSrc.url.replace('testingcf.jsdelivr.net', 'fastly.jsdelivr.net'),
                    currentSrc.url.replace('testingcf.jsdelivr.net', 'gcore.jsdelivr.net')
                  ]
                : [currentSrc.url],
              group: ''
            }];

        const results = await Promise.allSettled(
          tasks.map(async (t) => {
            let text = await fetchM3uWithRace(t.mirrors, forceRefresh);
            if (t.group) {
              text = text.replace(/^#EXTINF:([^\r\n,]*)/gm, (match, attrs) => {
                if (/group-title="[^"]*"/i.test(attrs)) {
                  return '#EXTINF:' + attrs.replace(/group-title="[^"]*"/i, `group-title="${t.group}"`);
                }
                return `#EXTINF:${attrs} group-title="${t.group}"`;
              });
            }
            return text;
          })
        );

        const mergedText = results
          .filter(r => r.status === 'fulfilled' && r.value)
          .map(r => r.value)
          .join('\n');

        if (!mergedText.trim()) {
          throw new Error('源站响应超时，请点击上方切换其他源');
        }

        allTvChannels = parseAndGroupM3u(mergedText);

        if (allTvChannels.length === 0) {
          statusEl.textContent = '当前源暂无可用频道，请点击上方切换其他源';
          return;
        }

        statusEl.style.display = 'none';
        renderTvGroups();
        renderTvChannels();
      } catch (err) {
        statusEl.textContent = '加载失败：' + (err.message || '网络异常');
      }
    }

    // 兼容解析标准 M3U (#EXTINF) 与 TVBox TXT (#genre#) 双格式，同时支持 https/http/youtube 协议
    function parseAndGroupM3u(text) {
      const lines = text.split(/\r?\n/);
      const channelMap = new Map();
      let currentMeta = null;
      let currentTxtGroup = '精选频道';

      const addChannelUrl = (name, group, url) => {
        if (!/^(https?|youtube):\/\//i.test(url)) return;
        // 过滤车机 WebCodecs 无法硬解的 H.265 / 4K 死链
        if (/hevc|h265|265|4k/i.test(name + ' ' + url)) return;

        const cleanName = name.trim() || '未知频道';
        const cleanGroup = group.trim() || '精选频道';
        if (!channelMap.has(cleanName)) {
          channelMap.set(cleanName, { name: cleanName, group: cleanGroup, urls: [] });
        }
        const item = channelMap.get(cleanName);
        if (!item.urls.includes(url)) {
          if (/^(https|youtube):\/\//i.test(url)) {
            item.urls.unshift(url);
          } else {
            item.urls.push(url);
          }
        }
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const commaIdx = line.lastIndexOf(',');
          const name = commaIdx !== -1 ? line.slice(commaIdx + 1).trim() : '未知频道';
          const group = (groupMatch && groupMatch[1].trim()) ? groupMatch[1].trim() : '精选频道';
          currentMeta = { name, group };
        } else if (!line.startsWith('#') && currentMeta) {
          addChannelUrl(currentMeta.name, currentMeta.group, line);
          currentMeta = null;
        } else if (line.includes('#genre#')) {
          currentTxtGroup = line.split(',')[0].trim() || '精选频道';
        } else if (!line.startsWith('#') && (line.includes(',http') || line.includes(',youtube://'))) {
          const commaIdx = line.indexOf(',');
          const name = line.slice(0, commaIdx).trim();
          const url = line.slice(commaIdx + 1).trim();
          url.split('#').forEach(singleUrl => {
            addChannelUrl(name, currentTxtGroup, singleUrl.trim());
          });
        }
      }
      return Array.from(channelMap.values());
    }

    function renderTvGroups() {
      const groupBar = document.getElementById('tv-group-bar');
      const groups = ['全部', ...new Set(allTvChannels.map(c => c.group))];
      if (!groups.includes(currentTvGroup)) currentTvGroup = '全部';

      groupBar.innerHTML = groups.map(g =>
        `<button class="tab ${g === currentTvGroup ? 'active' : ''}" onclick="selectTvGroup('${g.replace(/'/g, "\\'")}')">${g}</button>`
      ).join('');
    }

    function selectTvGroup(group) {
      currentTvGroup = group;
      renderTvGroups();
      renderTvChannels();
    }

    function renderTvChannels() {
      const grid = document.getElementById('tv-channel-grid');
      const statusEl = document.getElementById('tv-status');
      const keyword = (document.getElementById('tv-search-input').value || '').trim().toLowerCase();

      const filtered = allTvChannels.filter(ch => {
        const matchGroup = (currentTvGroup === '全部' || ch.group === currentTvGroup);
        const matchKeyword = !keyword || ch.name.toLowerCase().includes(keyword);
        return matchGroup && matchKeyword;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        statusEl.style.display = 'block';
        statusEl.textContent = '没有匹配的频道';
        return;
      }

      statusEl.style.display = 'none';
      const displayList = filtered.slice(0, 200);
      grid.innerHTML = displayList.map((ch) => {
        const safeName = ch.name.replace(/'/g, "\\'");
        const badge = ch.urls.length > 1 ? ` (${ch.urls.length}源)` : '';
        return `<button class="ep" style="font-size:14px;font-weight:600;" onclick="startChannelWithFallback('${safeName}')">${ch.name}${badge}</button>`;
      }).join('');
    }

    // 记录每个频道上次成功播放的 URL，下次点开优先使用
    const TV_GOOD_URL_KEY = 'tesla_tv_good_urls_v1';
    function getSavedGoodUrl(channelName) {
      try {
        const map = JSON.parse(localStorage.getItem(TV_GOOD_URL_KEY) || '{}');
        return map[channelName] || '';
      } catch (_) { return ''; }
    }
    function saveGoodUrl(channelName, url) {
      try {
        const map = JSON.parse(localStorage.getItem(TV_GOOD_URL_KEY) || '{}');
        map[channelName] = url;
        localStorage.setItem(TV_GOOD_URL_KEY, JSON.stringify(map));
      } catch (_) { /* ignore */ }
    }

    function startChannelWithFallback(channelName) {
      const ch = allTvChannels.find(c => c.name === channelName);
      if (!ch || !ch.urls.length) return;
      closeTvModal();

      const goodUrl = getSavedGoodUrl(ch.name);
      const sortedUrls = [...ch.urls];
      if (goodUrl && sortedUrls.includes(goodUrl)) {
        sortedUrls.splice(sortedUrls.indexOf(goodUrl), 1);
        sortedUrls.unshift(goodUrl);
      }

      currentTvQueue = {
        name: ch.name,
        urls: sortedUrls,
        index: 0
      };
      tryPlayCurrentQueueLine();
    }

    function tryPlayCurrentQueueLine() {
      if (!currentTvQueue) return;
      const { name, urls, index } = currentTvQueue;
      const url = urls[index];
      const titleSuffix = urls.length > 1 ? ` [线路 ${index + 1}/${urls.length}]` : '';

      if (typeof window.openIptvPlayer === 'function') {
        window.openIptvPlayer({
          name: name + titleSuffix,
          streamUrl: url,
          onSuccess: () => saveGoodUrl(name, url),
          onAllFailed: () => {
            if (currentTvQueue && currentTvQueue.index + 1 < currentTvQueue.urls.length) {
              currentTvQueue.index++;
              if (typeof showToast === 'function') {
                showToast(`线路 ${index + 1} 无响应，自动切换线路 ${currentTvQueue.index + 1}…`);
              }
              tryPlayCurrentQueueLine();
            } else {
              if (typeof showToast === 'function') {
                showToast(`${name} 所有备用线路均暂无信号`);
              }
            }
          }
        });
      }
    }
  </script>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/iptv-player.js" type="module"></script>
  <script src="js/app.js"></script>
</body>
</html>
