<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>车载影视</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 适配剧场无边框容器的动态视口锁定 */
    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      background: #0f1115;
    }

    /* 顶部栏右侧工具组 */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .fs-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 12px;
      flex-shrink: 0;
    }
    .fs-btn {
      background: #1c212b;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .fs-btn:active {
      background: #2b3342;
      border-color: #3e88f7;
    }

    /* 强制全屏状态下的视口锁定，消除黑边与溢出 */
    html:fullscreen, html:-webkit-full-screen,
    body:fullscreen, body:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #0f1115 !important;
      overflow: hidden !important;
    }
    :fullscreen #player-layer,
    :-webkit-full-screen #player-layer {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="topbar-left">
      <button id="btn-back" class="btn-back" onclick="historyBack()">‹</button>
      <div class="title-wrap">
        <span id="page-title">车载影视</span>
        <span id="page-sub" class="page-sub"></span>
      </div>
    </div>
    <!-- 顶部续播、直播与全屏控制区 -->
    <div class="fs-actions">
      <button class="fs-btn" onclick="resumeLastWatch(0)" style="border-color:#3fb950;color:#3fb950;">🕒 继续观看</button>
      <button class="fs-btn" onclick="openTvModal()" style="border-color:#00b4d8;color:#00b4d8;">📺 电视直播</button>
      <button id="btn-web-fs" class="fs-btn" onclick="toggleWebFullscreen()">⛶ 全屏</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- 播放器全屏层 -->
  <div id="player-layer" class="player-layer hidden">
    <div class="player-shell">
      <div class="player-head">
        <div class="player-head-left">
          <button class="player-close" onclick="exitAndClosePlayer()" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="quality-btn" id="btn-quality" style="display:none" onclick="cycleQuality()">清晰度</button>
          <!-- 播放器内部全屏切换按钮 -->
          <button class="quality-btn" id="btn-player-fs" onclick="toggleWebFullscreen()">⛶ 全屏</button>
        </div>
        <div class="player-title" id="player-title"></div>
      </div>
      <div id="player-box">
        <!-- AppleCMS 点播：车机本地 WebCodecs 解码到 Canvas -->
        <div id="drive-view" class="drive-view hidden">
          <div id="tesla-host"></div>
        </div>
        <!-- IPTV：WebCodecs 直播解码 -->
        <div id="iptv-view" class="drive-view hidden">
          <div id="iptv-host"></div>
        </div>
      </div>
      <div class="ep-strip" id="ep-strip"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal hidden"></div>

  <div id="toast" class="toast"></div>

  <script>
    // 1. 网页原生 Fullscreen API 切换
    function toggleWebFullscreen() {
      const elem = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // 2. 关闭播放器（同步刷新首页续播卡片）
    function exitAndClosePlayer() {
      if (typeof closePlayer === 'function') {
        closePlayer();
      }
      if (location.hash === '' || location.hash === '#/' || location.hash === '#') {
        if (typeof renderHome === 'function') renderHome();
      }
    }

    // 监听全屏状态变化，同步更新按钮文字与控制栏自动隐藏
    function syncFsButtonText() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const label = isFs ? '✕ 退出全屏' : '⛶ 全屏';
      const topBtn = document.getElementById('btn-web-fs');
      const playerBtn = document.getElementById('btn-player-fs');
      if (topBtn) topBtn.textContent = label;
      if (playerBtn) playerBtn.textContent = label;
    }

    // 全屏状态下：轻触屏幕显示上下控制栏，3 秒无操作自动隐藏
    let ctrlHideTimer = null;
    function wakeFullscreenControls() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFs) {
        document.documentElement.classList.remove('show-controls');
        return;
      }
      document.documentElement.classList.add('show-controls');
      clearTimeout(ctrlHideTimer);
      ctrlHideTimer = setTimeout(() => {
        document.documentElement.classList.remove('show-controls');
      }, 3000);
    }

    document.addEventListener('pointerdown', wakeFullscreenControls);
    document.addEventListener('fullscreenchange', () => {
      syncFsButtonText();
      wakeFullscreenControls();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      syncFsButtonText();
      wakeFullscreenControls();
    });
  </script>

  <!-- 电视直播频道弹窗（触屏直选源 + 自动过滤 HTTPS + 多线路容错） -->
  <div id="tv-modal" class="modal hidden" onclick="if(event.target===this)closeTvModal()">
    <div class="modal-body" style="max-width:760px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h3 style="margin:0;">📺 电视直播（HTTPS 直连）</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="quality-btn" style="min-height:38px;" onclick="loadTvChannels(true)">🔄 刷新</button>
          <button class="player-close" style="min-height:38px;" onclick="closeTvModal()">✕</button>
        </div>
      </div>

      <!-- 订阅源触屏切换按钮 -->
      <div id="tv-source-bar" class="tab-bar" style="padding:4px 0;"></div>

      <!-- 频道搜索框 -->
      <div class="search-row" style="margin-bottom:4px;">
        <input id="tv-search-input" type="text" placeholder="搜索频道（如：CCTV、卫视、凤凰、中天、TVBS…）" oninput="renderTvChannels()">
      </div>

      <!-- 分组标签栏 -->
      <div id="tv-group-bar" class="tab-bar" style="padding:2px 0 6px;"></div>

      <!-- 状态提示与频道网格 -->
      <div id="tv-status" class="tip" style="text-align:center;padding:8px 0;"></div>
      <div id="tv-channel-grid" class="ep-grid" style="grid-template-columns:repeat(auto-fill,minmax(135px,1fr));max-height:48vh;overflow-y:auto;padding-bottom:4px;"></div>
    </div>
  </div>

  <script>
    // 已验证可用的 HTTPS 自动更新订阅源
    const TV_SOURCES = [
      { name: '源1：Guovin 综合', url: 'https://testingcf.jsdelivr.net/gh/Guovin/iptv-api@gd/output/result.m3u' },
      { name: '源2：APTV 精品', url: 'https://testingcf.jsdelivr.net/gh/Kimentanm/aptv@master/m3u/iptv.m3u' },
      { name: '源3：ZBDS 加速源', url: 'https://live.zbds.top/tv/iptv4.m3u' },
      { name: '源4：ChinaIPTV', url: 'https://testingcf.jsdelivr.net/gh/hujingguang/ChinaIPTV@main/cnTV_AutoUpdate.m3u8' }
    ];

    let currentSourceIdx = 0;
    let allTvChannels = [];
    let currentTvGroup = '全部';
    let currentTvQueue = null;

    function renderTvSourceBar() {
      const bar = document.getElementById('tv-source-bar');
      if (!bar) return;
      bar.innerHTML = TV_SOURCES.map((src, idx) =>
        `<button class="tab ${idx === currentSourceIdx ? 'active' : ''}" onclick="switchTvSource(${idx})">${src.name}</button>`
      ).join('');
    }

    function switchTvSource(idx) {
      if (idx === currentSourceIdx && allTvChannels.length > 0) return;
      currentSourceIdx = idx;
      renderTvSourceBar();
      loadTvChannels(true);
    }

    function openTvModal() {
      renderTvSourceBar();
      document.getElementById('tv-modal').classList.remove('hidden');
      if (allTvChannels.length === 0) {
        loadTvChannels(false);
      } else {
        renderTvGroups();
        renderTvChannels();
      }
    }

    function closeTvModal() {
      document.getElementById('tv-modal').classList.add('hidden');
    }

    async function loadTvChannels(forceRefresh) {
      const statusEl = document.getElementById('tv-status');
      const gridEl = document.getElementById('tv-channel-grid');
      const m3uUrl = (TV_SOURCES[currentSourceIdx] || TV_SOURCES[0]).url;

      if (forceRefresh) {
        allTvChannels = [];
        gridEl.innerHTML = '';
      }
      statusEl.style.display = 'block';
      statusEl.textContent = '正在同步最新 HTTPS 频道列表…';

      try {
        let res = await fetch(m3uUrl, { cache: forceRefresh ? 'no-cache' : 'default' });
        if (!res.ok && m3uUrl.includes('testingcf.jsdelivr.net')) {
          const backupUrl = m3uUrl.replace('testingcf.jsdelivr.net', 'fastly.jsdelivr.net');
          res = await fetch(backupUrl, { cache: 'no-cache' });
        }
        if (!res.ok) {
          throw new Error(`源站返回 HTTP ${res.status}，请点击上方切换其他源`);
        }

        const m3uText = await res.text();
        allTvChannels = parseAndGroupM3u(m3uText);

        if (allTvChannels.length === 0) {
          statusEl.textContent = '当前源暂无可用的 HTTPS 频道，请点击上方切换其他源';
          return;
        }

        statusEl.style.display = 'none';
        renderTvGroups();
        renderTvChannels();
      } catch (err) {
        statusEl.textContent = '加载失败：' + (err.message || '网络异常');
      }
    }

    // 兼容解析标准 M3U (#EXTINF) 与 TVBox TXT (#genre#) 双格式，自动筛选 https:// 直连源
    function parseAndGroupM3u(text) {
      const lines = text.split(/\r?\n/);
      const channelMap = new Map();
      let currentMeta = null;
      let currentTxtGroup = '精选频道';

      const addChannelUrl = (name, group, url) => {
        if (!/^https:\/\//i.test(url)) return;
        const cleanName = name.trim() || '未知频道';
        const cleanGroup = group.trim() || '精选频道';
        if (!channelMap.has(cleanName)) {
          channelMap.set(cleanName, { name: cleanName, group: cleanGroup, urls: [] });
        }
        const item = channelMap.get(cleanName);
        if (!item.urls.includes(url)) {
          item.urls.push(url);
        }
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const commaIdx = line.lastIndexOf(',');
          const name = commaIdx !== -1 ? line.slice(commaIdx + 1).trim() : '未知频道';
          const group = (groupMatch && groupMatch[1].trim()) ? groupMatch[1].trim() : '精选频道';
          currentMeta = { name, group };
        } else if (!line.startsWith('#') && currentMeta) {
          addChannelUrl(currentMeta.name, currentMeta.group, line);
          currentMeta = null;
        } else if (line.includes('#genre#')) {
          currentTxtGroup = line.split(',')[0].trim() || '精选频道';
        } else if (!line.startsWith('#') && line.includes(',http')) {
          const commaIdx = line.indexOf(',');
          const name = line.slice(0, commaIdx).trim();
          const url = line.slice(commaIdx + 1).trim();
          url.split('#').forEach(singleUrl => {
            addChannelUrl(name, currentTxtGroup, singleUrl.trim());
          });
        }
      }
      return Array.from(channelMap.values());
    }

    function renderTvGroups() {
      const groupBar = document.getElementById('tv-group-bar');
      const groups = ['全部', ...new Set(allTvChannels.map(c => c.group))];
      if (!groups.includes(currentTvGroup)) currentTvGroup = '全部';

      groupBar.innerHTML = groups.map(g =>
        `<button class="tab ${g === currentTvGroup ? 'active' : ''}" onclick="selectTvGroup('${g.replace(/'/g, "\\'")}')">${g}</button>`
      ).join('');
    }

    function selectTvGroup(group) {
      currentTvGroup = group;
      renderTvGroups();
      renderTvChannels();
    }

    function renderTvChannels() {
      const grid = document.getElementById('tv-channel-grid');
      const statusEl = document.getElementById('tv-status');
      const keyword = (document.getElementById('tv-search-input').value || '').trim().toLowerCase();

      const filtered = allTvChannels.filter(ch => {
        const matchGroup = (currentTvGroup === '全部' || ch.group === currentTvGroup);
        const matchKeyword = !keyword || ch.name.toLowerCase().includes(keyword);
        return matchGroup && matchKeyword;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        statusEl.style.display = 'block';
        statusEl.textContent = '没有匹配的频道';
        return;
      }

      statusEl.style.display = 'none';
      const displayList = filtered.slice(0, 200);
      grid.innerHTML = displayList.map((ch) => {
        const safeName = ch.name.replace(/'/g, "\\'");
        const badge = ch.urls.length > 1 ? ` (${ch.urls.length}源)` : '';
        return `<button class="ep" style="font-size:14px;font-weight:600;" onclick="startChannelWithFallback('${safeName}')">${ch.name}${badge}</button>`;
      }).join('');
    }

    function startChannelWithFallback(channelName) {
      const ch = allTvChannels.find(c => c.name === channelName);
      if (!ch || !ch.urls.length) return;
      closeTvModal();
      currentTvQueue = {
        name: ch.name,
        urls: ch.urls,
        index: 0
      };
      tryPlayCurrentQueueLine();
    }

    function tryPlayCurrentQueueLine() {
      if (!currentTvQueue) return;
      const { name, urls, index } = currentTvQueue;
      const url = urls[index];
      const titleSuffix = urls.length > 1 ? ` [线路 ${index + 1}/${urls.length}]` : '';

      if (typeof window.openIptvPlayer === 'function') {
        window.openIptvPlayer({
          name: name + titleSuffix,
          streamUrl: url,
          onAllFailed: () => {
            if (currentTvQueue && currentTvQueue.index + 1 < currentTvQueue.urls.length) {
              currentTvQueue.index++;
              if (typeof showToast === 'function') {
                showToast(`线路 ${index + 1} 无响应，自动切换线路 ${currentTvQueue.index + 1}…`);
              }
              tryPlayCurrentQueueLine();
            } else {
              if (typeof showToast === 'function') {
                showToast(`${name} 所有备用线路均暂无信号`);
              }
            }
          }
        });
      }
    }
  </script>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/iptv-player.js" type="module"></script>
  <script src="js/app.js"></script>
</body>
</html>
