<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>车载电视直播</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
    }
    
    /* 左侧电视频道侧边栏 */
    #sidebar {
      width: 210px;
      min-width: 210px;
      background: #14161b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222630;
      z-index: 10;
    }
    .header {
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #222630;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header a {
      color: #3e88f7;
      text-decoration: none;
      font-size: 13px;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .channel-item {
      padding: 14px 18px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
      user-select: none;
    }
    .channel-item:hover {
      background: #1c1f26;
    }
    .channel-item.active {
      background: #232936;
      color: #3e88f7;
      font-weight: 600;
      border-left: 3px solid #3e88f7;
    }

    /* 右侧主画面（iframe 安全视口） */
    #main {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <span>电视直播</span>
      <a href="/">‹ 返回点播</a>
    </div>
    <div class="channel-list" id="list"></div>
  </div>

  <div id="main">
    <iframe id="live-frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <script>
    // 频道列表：全部采用官方已打通合法鉴权的轻量移动版直播视口
    const channels = [
      { name: "CCTV-13 新闻", url: "https://tv.cctv.com/live/cctv13/" },
      { name: "CCTV-1 综合", url: "https://tv.cctv.com/live/cctv1/" },
      { name: "CCTV-4 中文国际", url: "https://tv.cctv.com/live/cctv4/" },
      { name: "CCTV-2 财经", url: "https://tv.cctv.com/live/cctv2/" },
      { name: "CCTV-5 体育", url: "https://tv.cctv.com/live/cctv5/" },
      { name: "CCTV-6 电影", url: "https://tv.cctv.com/live/cctv6/" },
      { name: "看看新闻 现场直播", url: "https://live.kankanews.com/zhibo/" },
      { name: "荔枝网 广东新闻", url: "https://www.gdtv.cn/tvChannelDetail/44" }
    ];

    const frame = document.getElementById('live-frame');
    const listEl = document.getElementById('list');

    function switchChannel(c, el) {
      document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
      frame.src = c.url;
    }

    // 渲染频道列表，默认打开 CCTV-13 新闻
    channels.forEach((c, idx) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.innerText = c.name;
      item.onclick = () => switchChannel(c, item);
      listEl.appendChild(item);
      if (idx === 0) switchChannel(c, item);
    });
  </script>
</body>
</html>
