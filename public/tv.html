<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>车载电视直播</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      width: 100vw;
      min-height: 100vh;
      background: #0f1115;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      user-select: none;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #222630;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      color: #3e88f7;
      text-decoration: none;
      font-size: 15px;
      padding: 8px 16px;
      background: #1a1e26;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      background: #181b22;
      border: 1px solid #262a36;
      border-radius: 12px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    .card:active {
      transform: scale(0.96);
      background: #232834;
      border-color: #3e88f7;
    }
    .card-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-tag {
      font-size: 13px;
      color: #3e88f7;
      background: rgba(62, 136, 247, 0.12);
      padding: 3px 12px;
      border-radius: 20px;
    }
    .tip {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>电视直播专线</h1>
    <a href="/" class="back-btn">‹ 返回影视中心</a>
  </header>

  <div class="grid" id="grid"></div>
  <div class="tip">提示：进入播放后，轻触画面右下角可切换为车机全屏</div>

  <script>
    // 采用官方移动端极简播放视口
    const channels = [
      { name: "CCTV-13 新闻", tag: "24h即时新闻", url: "https://tv.cctv.com/live/cctv13/" },
      { name: "CCTV-1 综合", tag: "央视综合", url: "https://tv.cctv.com/live/cctv1/" },
      { name: "CCTV-4 中文国际", tag: "全球播报", url: "https://tv.cctv.com/live/cctv4/" },
      { name: "CCTV-2 财经", tag: "商业财经", url: "https://tv.cctv.com/live/cctv2/" },
      { name: "CCTV-5 体育", tag: "赛事现场", url: "https://tv.cctv.com/live/cctv5/" },
      { name: "CCTV-6 电影", tag: "正版电影", url: "https://tv.cctv.com/live/cctv6/" },
      { name: "看看新闻 现场", tag: "东方卫视资讯", url: "https://live.kankanews.com/zhibo/" },
      { name: "荔枝新闻 广东", tag: "大湾区资讯", url: "https://www.gdtv.cn/tvChannelDetail/44" }
    ];

    function openFullScreen(url) {
      // 借助用户点击手势，先触发浏览器层级的全屏
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }

      // 稍作微小延迟确保全屏动作被捕获，随后完成顶层跳转
      setTimeout(() => {
        window.location.href = url;
      }, 50);
    }

    const gridEl = document.getElementById('grid');
    channels.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${c.name}</div>
        <div class="card-tag">${c.tag}</div>
      `;
      card.onclick = () => openFullScreen(c.url);
      gridEl.appendChild(card);
    });
  </script>
</body>
</html>
