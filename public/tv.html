<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>车载电视直播</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1115; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    /* 左侧/底侧频道列表 */
    #sidebar {
      width: 220px;
      background: #181a20;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2e39;
    }
    .header { padding: 16px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #2a2e39; display: flex; justify-content: space-between; align-items: center; }
    .header a { color: #3e88f7; text-decoration: none; font-size: 13px; }
    .channel-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .channel-item {
      padding: 14px 18px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.2s;
    }
    .channel-item:hover, .channel-item.active { background: #2b303c; color: #3e88f7; font-weight: bold; }
    
    /* 右侧播放区域 */
    #main { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 4px; font-size: 14px; pointer-events: none; display: none; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <span>电视直播</span>
      <a href="/">‹ 返回点播</a>
    </div>
    <div class="channel-list" id="list"></div>
  </div>

  <div id="main">
    <video id="video" controls autoplay playsinline></video>
    <div id="toast"></div>
  </div>

  <script>
    // 频道列表配置（采用稳定、免代理直连的 CDN HLS 源）
    const channels = [
      { name: "CCTV-13 新闻", url: "https://liveplay-kk.cctv.cn/live/cctv13_2/index.m3u8" },
      { name: "CCTV-1 综合", url: "https://liveplay-kk.cctv.cn/live/cctv1_2/index.m3u8" },
      { name: "CCTV-4 中文国际", url: "https://liveplay-kk.cctv.cn/live/cctv4_2/index.m3u8" },
      { name: "CCTV-2 财经", url: "https://liveplay-kk.cctv.cn/live/cctv2_2/index.m3u8" },
      { name: "CCTV-5 体育", url: "https://liveplay-kk.cctv.cn/live/cctv5_2/index.m3u8" },
      { name: "凤凰卫视资讯台", url: "https://play-live.itv.mgtv.com/mgtv/fenghuangzixuntai.m3u8" },
      { name: "湖南卫视", url: "https://play-live.itv.mgtv.com/mgtv/hunanweishi.m3u8" },
      { name: "浙江卫视", url: "https://play-live.itv.mgtv.com/mgtv/zhejiangweishi.m3u8" },
      { name: "东方卫视", url: "https://play-live.itv.mgtv.com/mgtv/dongfangweishi.m3u8" }
    ];

    const video = document.getElementById('video');
    const listEl = document.getElementById('list');
    let hls = null;

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    function playChannel(c, el) {
      document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
      if(el) el.classList.add('active');
      showToast('正在加载: ' + c.name);

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(c.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = c.url;
        video.addEventListener('loadedmetadata', () => video.play());
      }
    }

    // 渲染频道列表
    channels.forEach((c, idx) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.innerText = c.name;
      item.onclick = () => playChannel(c, item);
      listEl.appendChild(item);
      if (idx === 0) playChannel(c, item); // 默认打开 CCTV-13
    });
  </script>
</body>
</html>
