<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>车载电视直播</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #0f1115;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-y: auto;
      padding: 24px;
    }
    
    /* 顶部导航 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #222630;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      color: #3e88f7;
      text-decoration: none;
      font-size: 15px;
      padding: 8px 14px;
      background: #1a1e26;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: #262c38;
    }

    /* 车载大触控卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      background: #181b22;
      border: 1px solid #262a36;
      border-radius: 12px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    .card:active {
      transform: scale(0.97);
      background: #232834;
      border-color: #3e88f7;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-tag {
      font-size: 12px;
      color: #3e88f7;
      background: rgba(62, 136, 247, 0.12);
      padding: 3px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>电视直播专线</h1>
    <a href="/" class="back-btn">‹ 返回影视中心</a>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    // 官方纯净移动版直播（顶层跳转，完美规避 iframe 盗播拦截）
    const channels = [
      { name: "CCTV-13 新闻", tag: "24h即时新闻", url: "https://tv.cctv.com/live/cctv13/" },
      { name: "CCTV-1 综合", tag: "央视综合", url: "https://tv.cctv.com/live/cctv1/" },
      { name: "CCTV-4 中文国际", tag: "全球播报", url: "https://tv.cctv.com/live/cctv4/" },
      { name: "CCTV-2 财经", tag: "商业财经", url: "https://tv.cctv.com/live/cctv2/" },
      { name: "CCTV-5 体育", tag: "赛事现场", url: "https://tv.cctv.com/live/cctv5/" },
      { name: "CCTV-6 电影", tag: "正版电影", url: "https://tv.cctv.com/live/cctv6/" },
      { name: "看看新闻 现场", tag: "东方卫视资讯", url: "https://live.kankanews.com/zhibo/" },
      { name: "荔枝新闻 广东", tag: "大湾区资讯", url: "https://www.gdtv.cn/tvChannelDetail/44" }
    ];

    const gridEl = document.getElementById('grid');
    channels.forEach(c => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = c.url;
      card.innerHTML = `
        <div class="card-title">${c.name}</div>
        <div class="card-tag">${c.tag}</div>
      `;
      gridEl.appendChild(card);
    });
  </script>
</body>
</html>
